<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update GoFast - Get the App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preload" href="assets/fonts/abc-solar-display-bold.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="assets/fonts/tt-norms-pro-regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="icon" type="image/png" href="assets/images/mascot.png">
    <meta name="title" content="Update GoFast - Get the App">
    <meta name="description" content="Update GoFast for Android or iOS. Find nearby taxis instantly — no registration, no commissions, just a ride.">
    <meta name="robots" content="index, follow">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="GoFast">
    <meta property="og:title" content="Update GoFast">
    <meta property="og:description" content="Update GoFast for Android or iOS and find a taxi near you in seconds.">
    <meta property="og:url" content="https://go-fast.app/Update.html">
    <meta property="og:image" content="https://go-fast.app/assets/images/logo.png">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        display: ['ABC Solar Display', 'sans-serif'],
                        body: ['TT Norms Pro', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            navy: '#001122',
                            blue: '#0099ff',
                            sky: '#00b4ff',
                        }
                    },
                    keyframes: {
                        fadeUp: {
                            '0%': { opacity: '0', transform: 'translateY(24px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                    },
                    animation: {
                        fadeUp: 'fadeUp 0.7s ease forwards',
                        'fadeUp-d1': 'fadeUp 0.7s 0.12s ease forwards',
                        'fadeUp-d2': 'fadeUp 0.7s 0.24s ease forwards',
                    }
                }
            }
        }
    </script>
    <style>
        @font-face {
            font-family: "ABC Solar Display";
            src: url("assets/fonts/abc-solar-display-bold.woff2") format("woff2");
            font-weight: 700; font-style: normal; font-display: swap;
        }
        @font-face {
            font-family: "TT Norms Pro";
            src: url("assets/fonts/tt-norms-pro-regular.woff2") format("woff2");
            font-weight: 400; font-style: normal; font-display: swap;
        }
        :root {
            --font-sans: "TT Norms Pro", Arial, Helvetica, sans-serif;
            --font-abc-solar-display: "ABC Solar Display", var(--font-sans);
        }
        html { scrollbar-width: none; }
        html::-webkit-scrollbar { display: none; }
        body { font-family: var(--font-sans); }
        .font-display { font-family: var(--font-abc-solar-display); letter-spacing: -0.01em; }
        .opacity-0-init { opacity: 0; }

        .store-btn {
            transition: transform 0.2s ease, opacity 0.2s ease;
        }
        .store-btn:hover {
            transform: translateY(-3px);
            opacity: 0.92;
        }
        .store-btn:active { transform: translateY(0); }
    </style>
</head>
<body class="min-h-screen bg-white text-brand-navy antialiased relative overflow-hidden">

    <main class="relative min-h-screen flex items-center justify-center px-5 py-16">
        <div class="max-w-xl w-full flex flex-col items-center text-center">

            <img src="assets/images/logo.png" alt="GoFast Logo" draggable="false"
                 class="w-64 md:w-80 max-w-full h-auto -ml-3 md:-ml-6 mb-3 opacity-0-init animate-fadeUp" />

            <h1 class="font-display text-3xl sm:text-4xl font-extrabold tracking-tight mb-4 opacity-0-init animate-fadeUp-d1">
                Update the app
            </h1>
            <p class="text-base sm:text-lg text-gray-500 leading-relaxed mb-10 sm:mb-12 max-w-sm opacity-0-init animate-fadeUp-d1">
                Stay updated for the best experience and get all the latest features.
            </p>

            <div class="flex flex-col gap-4 w-full max-w-md opacity-0-init animate-fadeUp-d2">

                <a href="https://android.go-fast.app/"
                   class="store-btn flex items-center justify-center gap-3 rounded-xl bg-gradient-to-br from-brand-blue to-brand-sky px-6 py-3.5">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 shrink-0 text-white" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M22.018 13.298l-3.919 2.218-3.515-3.493 3.543-3.521 3.891 2.202a1.49 1.49 0 0 1 0 2.594zM1.337.924a1.486 1.486 0 0 0-.112.568v21.017c0 .217.045.419.124.6l11.155-11.087zm12.207 10.065l3.258-3.238L3.45.195a1.466 1.466 0 0 0-.946-.179zm0 2.067l-11 10.933c.298.036.612-.016.906-.183l13.324-7.54z"/></svg>
                    <span class="font-display text-base font-semibold text-white">Update for Android</span>
                </a>

                <a href="https://ios.go-fast.app/"
                   class="store-btn flex items-center justify-center gap-3 rounded-xl bg-gradient-to-br from-brand-blue to-brand-sky px-6 py-3.5">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 shrink-0 text-white" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zm3.377-3.066c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701z"/></svg>
                    <span class="font-display text-base font-semibold text-white">Update for iOS</span>
                </a>

            </div>

        </div>
    </main>

</body>
</html>
