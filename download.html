<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download GoFast - Get the App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/png" href="assets/images/mascot.png">
    <meta name="title" content="Download GoFast - Get the App">
    <meta name="description" content="Download GoFast for Android or iOS. Find nearby taxis instantly — no registration, no commissions, just a ride.">
    <meta name="robots" content="index, follow">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="GoFast">
    <meta property="og:title" content="Download GoFast">
    <meta property="og:description" content="Download GoFast for Android or iOS and find a taxi near you in seconds.">
    <meta property="og:url" content="https://go-fast.app/download.html">
    <meta property="og:image" content="https://go-fast.app/assets/images/logo.png">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        display: ['Sora', 'sans-serif'],
                        body: ['DM Sans', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            navy: '#001122',
                            blue: '#0099ff',
                            sky: '#00b4ff',
                        }
                    },
                    keyframes: {
                        fadeUp: {
                            '0%': { opacity: '0', transform: 'translateY(24px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                    },
                    animation: {
                        fadeUp: 'fadeUp 0.7s ease forwards',
                        'fadeUp-d1': 'fadeUp 0.7s 0.12s ease forwards',
                        'fadeUp-d2': 'fadeUp 0.7s 0.24s ease forwards',
                    }
                }
            }
        }
    </script>
    <style>
        html { scrollbar-width: none; }
        html::-webkit-scrollbar { display: none; }
        body { font-family: 'DM Sans', sans-serif; }
        .font-display { font-family: 'Sora', sans-serif; }
        .opacity-0-init { opacity: 0; }

        .store-btn {
            transition: transform 0.2s ease, opacity 0.2s ease;
        }
        .store-btn:hover {
            transform: translateY(-3px);
            opacity: 0.92;
        }
        .store-btn:active { transform: translateY(0); }
    </style>
</head>
<body class="min-h-screen bg-white text-brand-navy antialiased relative overflow-hidden">

    <main class="relative min-h-screen flex items-center justify-center px-5 py-16">
        <div class="max-w-xl w-full flex flex-col items-center text-center">

            <img src="assets/images/logo.png" alt="GoFast Logo" draggable="false"
                 class="w-52 sm:w-64 md:w-72 max-w-full h-auto mb-3 opacity-0-init animate-fadeUp" />

            <h1 class="font-display text-3xl sm:text-4xl md:text-5xl font-extrabold tracking-tight mb-4 opacity-0-init animate-fadeUp-d1">
                Download the app
            </h1>
            <p class="text-base sm:text-lg text-gray-500 leading-relaxed mb-10 sm:mb-12 max-w-sm opacity-0-init animate-fadeUp-d1">
                Pick your phone and the app will download. No registration, no commissions — just a ride.
            </p>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 w-full max-w-md opacity-0-init animate-fadeUp-d2">

                <!-- Android -->
                <a href="https://android.go-fast.app/"
                   class="store-btn flex items-center justify-center gap-3 rounded-xl bg-gradient-to-br from-brand-blue to-brand-sky px-6 py-3.5">
                    <i class="fab fa-google-play text-2xl text-white"></i>
                    <span class="font-display text-base font-semibold text-white">Download for Android</span>
                </a>

                <!-- iOS -->
                <a href="https://ios.go-fast.app/"
                   class="store-btn flex items-center justify-center gap-3 rounded-xl bg-gradient-to-br from-brand-blue to-brand-sky px-6 py-3.5">
                    <i class="fab fa-apple text-2xl text-white"></i>
                    <span class="font-display text-base font-semibold text-white">Download for iOS</span>
                </a>

            </div>

        </div>
    </main>

</body>
</html>
