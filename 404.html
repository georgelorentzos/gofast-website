<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page Not Found | GoFast</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preload" href="assets/fonts/abc-solar-display-bold.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="assets/fonts/tt-norms-pro-regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="icon" type="image/png" href="assets/images/mascot.png">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        display: ['ABC Solar Display', 'sans-serif'],
                        body: ['TT Norms Pro', 'sans-serif'],
                        brand: ['ABC Solar Display', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            navy: '#001122',
                            blue: '#0099ff',
                            sky: '#00b4ff',
                        }
                    },
                    keyframes: {
                        fadeUp: {
                            '0%': { opacity: '0', transform: 'translateY(24px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-12px)' },
                        }
                    },
                    animation: {
                        fadeUp: 'fadeUp 0.7s ease forwards',
                        'fadeUp-d1': 'fadeUp 0.7s 0.1s ease forwards',
                        'fadeUp-d2': 'fadeUp 0.7s 0.2s ease forwards',
                        'fadeUp-d3': 'fadeUp 0.7s 0.3s ease forwards',
                        float: 'float 6s ease-in-out infinite',
                    }
                }
            }
        }
    </script>
    <style>
        @font-face {
            font-family: "ABC Solar Display";
            src: url("assets/fonts/abc-solar-display-bold.woff2") format("woff2");
            font-weight: 700; font-style: normal; font-display: swap;
        }
        @font-face {
            font-family: "TT Norms Pro";
            src: url("assets/fonts/tt-norms-pro-regular.woff2") format("woff2");
            font-weight: 400; font-style: normal; font-display: swap;
        }
        :root {
            --font-sans: "TT Norms Pro", Arial, Helvetica, sans-serif;
            --font-abc-solar-display: "ABC Solar Display", var(--font-sans);
        }
        html { scrollbar-width: none; }
        html::-webkit-scrollbar { display: none; }
        body { font-family: var(--font-sans); }
        .font-display { font-family: var(--font-abc-solar-display); letter-spacing: -0.01em; }
        .font-brand { font-family: inherit; }

        .mascot-float {
            width: 220px;
            height: auto;
            animation: float 6s ease-in-out infinite;
        }

        .error-code {
            font-size: clamp(7rem, 22vw, 14rem);
            line-height: 0.9;
            letter-spacing: -0.04em;
            background: linear-gradient(135deg, #01A9D5 0%, #00b4ff 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .opacity-0-init { opacity: 0; }
    </style>
</head>
<body class="bg-white text-gray-500 antialiased min-h-screen flex flex-col">

    <main class="flex-1 flex items-center justify-center px-5 py-20">
        <div class="max-w-6xl mx-auto w-full">
            <div class="flex flex-col-reverse md:flex-row items-center justify-center gap-12 md:gap-24">

                <div class="flex flex-col items-center md:items-start text-center md:text-left max-w-md opacity-0-init animate-fadeUp">

                    <h1 class="error-code font-display font-extrabold mb-2">404</h1>

                    <h2 class="font-display font-bold text-3xl md:text-4xl text-[#001122] mb-4 leading-tight">
                        Wrong turn somewhere
                    </h2>

                    <p class="text-lg md:text-xl text-gray-500 leading-relaxed mb-10 max-w-sm">
                        The page you're looking for took a different route. Let's get you back on track.
                    </p>

                    <div class="flex flex-col sm:flex-row gap-4 w-full sm:w-auto">
                        <a href="https://go-fast.app/" class="inline-flex items-center justify-center gap-2 bg-[#01A9D5] text-white font-display font-semibold text-base rounded-2xl px-7 py-3.5 transition-transform duration-200 hover:-translate-y-0.5" style="-webkit-box-shadow: 0 10px 24px -10px rgba(1,169,213,.6); box-shadow: 0 10px 24px -10px rgba(1,169,213,.6);">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l9-9 9 9M5 10v10a1 1 0 001 1h4v-6h4v6h4a1 1 0 001-1V10"/></svg>
                            Back to Home
                        </a>
                    </div>
                </div>

            </div>
        </div>
    </main>

</body>
</html>
