<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page Not Found | GoFast</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=DM+Sans:wght@300;400;500;600&family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/png" href="assets/images/mascot.png">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        display: ['Sora', 'sans-serif'],
                        body: ['DM Sans', 'sans-serif'],
                        brand: ['Roboto', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            navy: '#001122',
                            blue: '#0099ff',
                            sky: '#00b4ff',
                        }
                    },
                    keyframes: {
                        fadeUp: {
                            '0%': { opacity: '0', transform: 'translateY(24px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-12px)' },
                        }
                    },
                    animation: {
                        fadeUp: 'fadeUp 0.7s ease forwards',
                        'fadeUp-d1': 'fadeUp 0.7s 0.1s ease forwards',
                        'fadeUp-d2': 'fadeUp 0.7s 0.2s ease forwards',
                        'fadeUp-d3': 'fadeUp 0.7s 0.3s ease forwards',
                        float: 'float 6s ease-in-out infinite',
                    }
                }
            }
        }
    </script>
    <style>
        html { scrollbar-width: none; }
        html::-webkit-scrollbar { display: none; }
        body { font-family: 'DM Sans', sans-serif; }
        .font-display { font-family: 'Sora', sans-serif; }
        .font-brand { font-family: 'Roboto', sans-serif; }

        .mascot-float {
            width: 220px;
            height: auto;
            animation: float 6s ease-in-out infinite;
        }

        .error-code {
            font-size: clamp(7rem, 22vw, 14rem);
            line-height: 0.9;
            letter-spacing: -0.04em;
            background: linear-gradient(135deg, #01A9D5 0%, #00b4ff 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .opacity-0-init { opacity: 0; }
    </style>
</head>
<body class="bg-white text-gray-500 antialiased min-h-screen flex flex-col">

    <main class="flex-1 flex items-center justify-center px-5 py-20">
        <div class="max-w-6xl mx-auto w-full">
            <div class="flex flex-col-reverse md:flex-row items-center justify-center gap-12 md:gap-24">

                <div class="flex flex-col items-center md:items-start text-center md:text-left max-w-md opacity-0-init animate-fadeUp">

                    <h1 class="error-code font-display font-extrabold mb-2">404</h1>

                    <h2 class="font-display font-bold text-3xl md:text-4xl text-[#001122] mb-4 leading-tight">
                        Wrong turn somewhere
                    </h2>

                    <p class="text-lg md:text-xl text-gray-500 leading-relaxed mb-10 max-w-sm">
                        The page you're looking for took a different route. Let's get you back on track.
                    </p>

                    <div class="flex flex-col sm:flex-row gap-4 w-full sm:w-auto">
                        <a href="https://go-fast.app/" class="inline-flex items-center justify-center gap-2 bg-[#01A9D5] text-white font-display font-semibold text-base rounded-2xl px-7 py-3.5 shadow-sm shadow-[#01A9D5]/30 transition-all duration-200 hover:shadow-md hover:-translate-y-0.5">
                            <i class="fa-solid fa-house text-sm"></i>
                            Back to Home
                        </a>
                    </div>
                </div>

            </div>
        </div>
    </main>

</body>
</html>
